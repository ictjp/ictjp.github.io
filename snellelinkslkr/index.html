<!DOCTYPE html>
<html lang="en">
<head>
	<title>Snelle links leerkrachten</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="select-css.css">
	<link rel="stylesheet" href="demo.css">

<script>

function readCookie(name) {
  var nameEQ = name + "=";
  var ca = document.cookie.split(';');
  for(var i = 0; i < ca.length; i++) {
    var c = ca[i];
    while (c.charAt(0) == ' ') c = c.substring(1, c.length);
    if (c.indexOf(nameEQ) == 0) return c.substring(nameEQ.length, c.length);
  }
  return null;
}

document.addEventListener('DOMContentLoaded', function() {
    var schoolSelect = document.getElementById('SchoolKeuze');
    var selectedSchool = readCookie('school');

    schoolSelect.value = selectedSchool;
    saveclass = saveclass ? saveclass : document.body.className;
    document.body.className = saveclass + ' ' + selectedSchool;
});

</script>

</head>
<body>
<script>
var saveclass = null;

function saveSchool(cookieValue)
{
    setCookie('school', cookieValue, 3650);
	alert(cookieValue);
}

function setCookie(cookieName, cookieValue, nDays) {
    var today = new Date();
    var expire = new Date();

    if (nDays==null || nDays==0)
        nDays=1;

    expire.setTime(today.getTime() + 3600000*24*nDays);
    document.cookie = cookieName+"="+escape(cookieValue) + ";expires="+expire.toGMTString();
	alert("Cookie is set!");
}


</script>
<center>
<h1>Snelle links leerkrachten</h1>
</center>

<div class="dark-wrapper">
<center>

<label style="display: inline-block;"> </label>
<select id="SchoolKeuze" class="select-css" style="display: inline-block; width: auto;" onchange="saveSchool(this.value);">
	<option value="Springplank">GVBS De Springplank</option>
	<option value="Wingerd">GVBS De Wingerd</option>
	<option value="Klavernest">GVBS 't Klavernest</option>
	<option value="DuizendpootWervetuin">GVKS Duizendpoot - Wervetuin</option>
	<option value="Windekind">GVLS Windekind</option>
	<option selected>Kies hier je school!</option>
</select>

</center>
</div>



</body>
</html>
