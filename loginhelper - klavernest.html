<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Loginhelper</title>

<style>

/* Kleuren gebaseerd op logo */
:root {
  --groen: #9DC66B;
  --groen-donker: #7FA650;
  --blauw: #4A5C8A;
  --lichtblauw: #E5F1F6;
  --wit: #ffffff;
}

body {
  font-family: Arial, sans-serif;
  background: var(--lichtblauw);
  margin: 0;
  padding: 40px 30px;
}

.container {
  background: var(--wit);
  padding: 25px;
  border-radius: 20px;
  max-width: 900px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: 1fr 300px;
  gap: 25px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.1);
}

h1 {
  color: var(--blauw);
}

h2 {
  color: var(--blauw);
}

label {
  font-size: 18px;
  color: var(--blauw);
}

/* Input */
input {
  width: 100%;
  padding: 15px;
  margin-top: 10px;
  border-radius: 10px;
  border: 2px solid var(--groen);
  font-size: 20px;
}

/* Knoppen algemeen */
button {
  width: 100%;
  padding: 15px;
  margin-top: 15px;
  background: var(--groen);
  color: white;
  border: none;
  border-radius: 12px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
  transition: opacity 0.2s, transform 0.1s;
}

button:hover {
  opacity: 0.9;
}

button:active {
  transform: scale(0.98);
}

/* Specifieke Office-kleuren */
.btn-teams {
  background-color: #6264A7;
}

.btn-word {
  background-color: #2B579A;
}

.btn-powerpoint {
  background-color: #D24726;
}

.btn-onedrive {
  background-color: #0078D4;
}

.btn-outlook {
  background-color: #0072C6;
}

/* Email display & Kopieerknop */
#emailDisplay {
  margin-top: 15px;
  font-size: 24px;
  text-align: center;
  font-weight: bold;
  color: var(--blauw);
}

.copy-button {
  display: none;
  background-color: var(--groen);
}

.copy-button:hover {
  background-color: var(--groen-donker);
}

</style>
</head>

<body>

<div class="container">

<div>
<h1>Loginhelper</h1>

<label>Typ je S-nummer:</label>
<input id="s" type="text" placeholder="123456" oninput="makeEmail()">

<div id="emailDisplay"></div>

<button id="copyBtn" class="copy-button" onclick="copyEmail()">Kopieer</button>

<textarea id="hiddenCopyBox" style="opacity:0; position:absolute;"></textarea>
</div>

<div>
<h2>Office</h2>

<button class="btn-teams" onclick="openApp('teams')">Teams</button>
<button class="btn-word" onclick="openApp('word')">Word</button>
<button class="btn-powerpoint" onclick="openApp('powerpoint')">PowerPoint</button>
<button class="btn-onedrive" onclick="openApp('onedrive')">OneDrive</button>
<button class="btn-outlook" onclick="openApp('outlook')">Outlook</button>

</div>

</div>

<script>
let currentEmail = "";

function makeEmail() {
  let raw = document.getElementById("s").value.trim();

  if (raw.startsWith("s")) raw = raw.slice(1);

  if (!/^[0-9]{6}$/.test(raw)) {
    document.getElementById("emailDisplay").textContent = "";
    currentEmail = "";
    document.getElementById("copyBtn").style.display = "none";
    return;
  }

  currentEmail = "s" + raw + "@leerling.klavernest.be";

  document.getElementById("emailDisplay").textContent = currentEmail;
  document.getElementById("copyBtn").style.display = "block";
}

function copyEmail() {
  const box = document.getElementById("hiddenCopyBox");
  box.value = currentEmail;
  box.select();
  document.execCommand("copy");
  alert("Gekopieerd!");
}

function openApp(app) {

  if (!currentEmail) {
    alert("⚠️ Typ eerst een geldig S-nummer");
    return;
  }

  let url = "";

  switch(app) {
    case "teams":
      url = "https://teams.microsoft.com/?login_hint=" + currentEmail;
      break;

    case "word":
      url = "https://www.office.com/launch/word?auth=2&login_hint=" + currentEmail;
      break;

    case "powerpoint":
      url = "https://www.office.com/launch/powerpoint?auth=2&login_hint=" + currentEmail;
      break;

    case "onedrive":
      url = "https://www.office.com/launch/onedrive?auth=2&login_hint=" + currentEmail;
      break;

    case "outlook":
      url = "https://www.office.com/launch/outlook?auth=2&login_hint=" + currentEmail;
      break;
  }

  window.open(url, "_blank");
}
</script>

</body>
</html>
